<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">A ClaimCoach case, from denial to outcome</title>
  <desc id="d">Seven steps. 1 Add documents. 2 Extract, with Qwen3-VL-8B, or rules for 835 text. 3 Confirm the fields it could not read; when every field reads, the diagnosis starts on its own. 4 Diagnose with Qwen3-8B and Qwen3-14B, from the payer's rule cards and code notes. 5 Draft an appeal letter, or the list of corrections for the claim, with Ternary-Bonsai-2-27B. 6 Edit the letter and export it, or the corrections, as PDF or DOCX; the biller files it. 7 Record the outcome, which closes the case and feeds the manager dashboard. In v1.1 a recorded payer call is transcribed after hours by Voxtral-Small-24B.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .card{fill:#FFFFFF;stroke:#B9CCC8;stroke-width:1.5}
    .you{fill:#FFF8EB;stroke:#D97706;stroke-width:1.5}
    .mgr{fill:#EEF6F4;stroke:#0F5E59;stroke-width:1.5}
    .dot{fill:#0F5E59}.dotyou{fill:#B45309}
    .n{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#FFFFFF}
    .h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}
    .b{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#111827}
    .s{font:400 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#374151}
    .chip{fill:#E6F2EF}.chipyou{fill:#FDECC8}
    .c{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0F5E59}
    .cyou{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#92400E}
    .l{font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#4B5563}
    .flow{stroke:#0F5E59;stroke-width:2.5;fill:none}
    .side{stroke:#6B7280;stroke-width:2;fill:none;stroke-dasharray:6 5}
    .mflow{fill:#0F5E59}.mside{fill:#6B7280}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0D1117}
      .card{fill:#161B22;stroke:#30363D}
      .you{fill:#2A2110;stroke:#F59E0B}
      .mgr{fill:#0F2A27;stroke:#2DD4BF}
      .dot{fill:#0F766E}.dotyou{fill:#B45309}
      .n{fill:#FFFFFF}
      .h,.b{fill:#E6EDF3}
      .s{fill:#C9D1D9}.l{fill:#9DA7B3}
      .chip{fill:#12332F}.chipyou{fill:#3D2E0F}
      .c{fill:#5EEAD4}.cyou{fill:#FCD34D}
      .flow{stroke:#2DD4BF}.side{stroke:#8B949E}
      .mflow{fill:#2DD4BF}.mside{fill:#8B949E}
    }
  </style>
  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mflow" d="M0 0L10 5L0 10z"/></marker>
    <marker id="a-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mside" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="640" rx="16"/>
  <text class="h" x="28" y="42">A ClaimCoach case, from denial to outcome</text>
  <text class="l" x="28" y="66">Teal steps are ClaimCoach's, on this Mac. Amber steps are yours. Nothing is sent to a payer.</text>

  <rect class="card" x="24" y="92" width="255" height="176" rx="12"/>
  <circle class="dot" cx="50" cy="120" r="15"/><text class="n" x="45.5" y="125.5">1</text>
  <text class="b" x="74" y="126">Add documents</text>
  <text class="s" x="40" y="158">Drop the EOB/ERA (PDF or image)</text>
  <text class="s" x="40" y="178">and the denial letter, or paste</text>
  <text class="s" x="40" y="198">835 text. Stored encrypted.</text>
  <rect class="chip" x="40" y="226" width="223" height="26" rx="13"/>
  <text class="c" x="54" y="243">No model: stored as you gave it</text>

  <rect class="card" x="318" y="92" width="255" height="176" rx="12"/>
  <circle class="dot" cx="344" cy="120" r="15"/><text class="n" x="339.5" y="125.5">2</text>
  <text class="b" x="368" y="126">Extract</text>
  <text class="s" x="334" y="158">Reads claim lines, CARC/RARC</text>
  <text class="s" x="334" y="178">codes, dates, and amounts, and</text>
  <text class="s" x="334" y="198">flags what it could not read.</text>
  <rect class="chip" x="334" y="226" width="223" height="26" rx="13"/>
  <text class="c" x="348" y="243">Qwen3-VL-8B · 835 by rules</text>

  <rect class="you" x="612" y="92" width="255" height="176" rx="12"/>
  <circle class="dotyou" cx="638" cy="120" r="15"/><text class="n" x="633.5" y="125.5">3</text>
  <text class="b" x="662" y="126">Confirm</text>
  <text class="s" x="628" y="158">You confirm the fields it could</text>
  <text class="s" x="628" y="178">not read (highlighted). When all</text>
  <text class="s" x="628" y="198">read, the diagnosis just starts.</text>
  <rect class="chipyou" x="628" y="226" width="223" height="26" rx="13"/>
  <text class="cyou" x="642" y="243">You</text>

  <rect class="card" x="906" y="92" width="270" height="176" rx="12"/>
  <circle class="dot" cx="932" cy="120" r="15"/><text class="n" x="927.5" y="125.5">4</text>
  <text class="b" x="956" y="126">Diagnose</text>
  <text class="s" x="922" y="158">Denial reason, appeal likelihood,</text>
  <text class="s" x="922" y="178">deadline, a plain-language why,</text>
  <text class="s" x="922" y="198">and a missing-documents checklist.</text>
  <rect class="chip" x="922" y="226" width="238" height="26" rx="13"/>
  <text class="c" x="936" y="243">Qwen3-8B · Qwen3-14B · rule cards</text>

  <rect class="card" x="906" y="318" width="270" height="176" rx="12"/>
  <circle class="dot" cx="932" cy="346" r="15"/><text class="n" x="927.5" y="351.5">5</text>
  <text class="b" x="956" y="352">Draft</text>
  <text class="s" x="922" y="384">An appeal letter, or the list of</text>
  <text class="s" x="922" y="404">corrections for the claim, from</text>
  <text class="s" x="922" y="424">the payer's rule card. You review.</text>
  <rect class="chip" x="922" y="452" width="238" height="26" rx="13"/>
  <text class="c" x="936" y="469">Ternary-Bonsai-2-27B</text>

  <rect class="you" x="612" y="318" width="255" height="176" rx="12"/>
  <circle class="dotyou" cx="638" cy="346" r="15"/><text class="n" x="633.5" y="351.5">6</text>
  <text class="b" x="662" y="352">Edit and export</text>
  <text class="s" x="628" y="384">Edit the letter in the pane,</text>
  <text class="s" x="628" y="404">export PDF or DOCX, and file it</text>
  <text class="s" x="628" y="424">yourself. ClaimCoach never sends.</text>
  <rect class="chipyou" x="628" y="452" width="223" height="26" rx="13"/>
  <text class="cyou" x="642" y="469">You</text>

  <rect class="you" x="318" y="318" width="255" height="176" rx="12"/>
  <circle class="dotyou" cx="344" cy="346" r="15"/><text class="n" x="339.5" y="351.5">7</text>
  <text class="b" x="368" y="352">Record the outcome</text>
  <text class="s" x="334" y="384">Overturned, upheld, or written</text>
  <text class="s" x="334" y="404">off. The case closes; documents</text>
  <text class="s" x="334" y="424">purge after the retention period.</text>
  <rect class="chipyou" x="334" y="452" width="223" height="26" rx="13"/>
  <text class="cyou" x="348" y="469">You · kept de-identified</text>

  <rect class="mgr" x="24" y="318" width="255" height="176" rx="12"/>
  <text class="b" x="40" y="352">Manager dashboard</text>
  <text class="s" x="40" y="384">Weekly overturn rates per payer</text>
  <text class="s" x="40" y="404">and code, from profiles that</text>
  <text class="s" x="40" y="424">share. Approved fine-tune export.</text>
  <rect class="chip" x="40" y="452" width="223" height="26" rx="13"/>
  <text class="c" x="54" y="469">No case documents</text>

  <path class="flow" d="M279 180H314" marker-end="url(#a-flow)"/>
  <path class="flow" d="M573 180H608" marker-end="url(#a-flow)"/>
  <path class="flow" d="M867 180H902" marker-end="url(#a-flow)"/>
  <path class="flow" d="M1041 268V314" marker-end="url(#a-flow)"/>
  <path class="flow" d="M906 406H871" marker-end="url(#a-flow)"/>
  <path class="flow" d="M612 406H577" marker-end="url(#a-flow)"/>
  <path class="side" d="M318 406H283" marker-end="url(#a-side)"/>

  <text class="b" x="24" y="548">v1.1 · Payer calls</text>
  <rect class="card" x="190" y="526" width="270" height="44" rx="10"/>
  <text class="s" x="206" y="553">Attach a recorded payer call</text>
  <rect class="card" x="500" y="526" width="330" height="44" rx="10"/>
  <text class="s" x="516" y="553">Transcribed after hours · Voxtral-Small-24B</text>
  <rect class="card" x="870" y="526" width="306" height="44" rx="10"/>
  <text class="s" x="886" y="553">Reference number and rep's instructions</text>
  <path class="side" d="M460 548H496" marker-end="url(#a-side)"/>
  <path class="side" d="M830 548H866" marker-end="url(#a-side)"/>
  <text class="l" x="24" y="606">Any time: ask the Hermes agent "what usually fixes CO-197 for this payer?" It answers from the global corpus and never sees the case's documents.</text>
</svg>
