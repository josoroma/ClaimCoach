<svg xmlns="http://www.w3.org/2000/svg" class="dark" viewBox="0 0 944 464" width="944" height="464" role="img" aria-labelledby="flow-user-title flow-user-desc">
  <title id="flow-user-title">A ClaimCoach case, from denial to outcome</title>
  <desc id="flow-user-desc">Seven steps: add documents or paste 835 text, extract with Qwen3-VL-8B (835 text by rules), confirm the fields it could not read, diagnose with Qwen3-8B and Qwen3-14B, draft an appeal or a corrected claim with Ternary-Bonsai-2-27B, edit and export for the biller to file, and record the outcome, which feeds the manager dashboard of opted-in profiles; a recorded payer call is transcribed after hours by Voxtral-Small-24B into the case.</desc>
  <style>
    :root{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}
    .dark{--background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--card-foreground:oklch(0.985 0 0);--primary:oklch(0.922 0 0);--secondary:oklch(0.269 0 0);--secondary-foreground:oklch(0.985 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);--border:oklch(1 0 0 / 10%);--ring:oklch(0.556 0 0);--chart-2:oklch(0.556 0 0);}
    @media (prefers-color-scheme: light){:root.dark{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}}
    text{font-family:Geist,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;stroke:none}
    rect.node{fill:var(--card);stroke:var(--border);stroke-width:1}
    rect.node-accent{fill:var(--card);stroke:var(--primary);stroke-width:1.2}
    rect.node-optional{fill:var(--card);stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    rect.tag{fill:none;stroke:var(--ring);stroke-width:0.8}
    rect.chip{fill:var(--secondary);stroke:var(--border);stroke-width:0.8}
    rect.frame{fill:var(--muted);fill-opacity:0.35;stroke:var(--chart-2);stroke-width:1}
    rect.tab{fill:var(--secondary);stroke:var(--chart-2);stroke-width:1}
    path.rule{fill:none;stroke:var(--border);stroke-width:0.8}
    path.life{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:3 3}
    path.arrow{fill:none;stroke:var(--muted-foreground);stroke-width:1}
    path.nophi{stroke-dasharray:5 4}
    path.return{stroke-dasharray:5 4}
    path.arrow-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    polygon.head{fill:var(--muted-foreground)}
    polygon.head-accent{fill:var(--primary)}
    polyline.head-open{fill:none;stroke:var(--muted-foreground);stroke-width:1.2}
    .name{fill:var(--card-foreground);font-size:14px;font-weight:600}
    .sub{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
    .tagtext{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:500;letter-spacing:0.08em}
    .label{fill:var(--secondary-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:0.06em}
    .eyebrow{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;letter-spacing:0.14em}
    .msg{fill:var(--foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .guard{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .callout{fill:var(--muted-foreground);font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}
    .legend{fill:var(--muted-foreground);font-size:12px}
  </style>
  <defs><marker id="flow-user-head" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker><marker id="flow-user-head-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="flow-user-head-open" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polyline class="head-open" points="0 0, 8 3, 0 6"/></marker></defs>
  <path class="arrow" d="M224 60H256" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M456 60H488" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M688 60H720" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M820 96V168" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M720 204H688" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M488 204H456" marker-end="url(#flow-user-head)"/>
  <path class="arrow nophi" d="M356 240V312" marker-end="url(#flow-user-head)"/>
  <path class="arrow" d="M124 168V96" marker-end="url(#flow-user-head)"/>
  <path class="rule" d="M24 408H920"/>
  <g class="node"><rect class="node" x="24" y="24" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="32" y="32" width="44" height="12" rx="2"/><text class="tagtext" x="54" y="41" text-anchor="middle">STEP 1</text></g><text class="name" x="32" y="66">Add documents</text><text class="sub" x="32" y="82">EOB · ERA · letter · 835</text></g>
  <g class="node"><rect class="node" x="256" y="24" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="264" y="32" width="44" height="12" rx="2"/><text class="tagtext" x="286" y="41" text-anchor="middle">STEP 2</text></g><text class="name" x="264" y="66">Extract</text><text class="sub" x="264" y="82">Qwen3-VL-8B · 835 by rules</text></g>
  <g class="node"><rect class="node" x="488" y="24" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="496" y="32" width="76" height="12" rx="2"/><text class="tagtext" x="534" y="41" text-anchor="middle">STEP 3 · YOU</text></g><text class="name" x="496" y="66">Confirm</text><text class="sub" x="496" y="82">unreadable fields only</text></g>
  <g class="node"><rect class="node" x="720" y="24" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="728" y="32" width="44" height="12" rx="2"/><text class="tagtext" x="750" y="41" text-anchor="middle">STEP 4</text></g><text class="name" x="728" y="66">Diagnose</text><text class="sub" x="728" y="82">Qwen3-8B · Qwen3-14B</text></g>
  <g class="node"><rect class="node" x="720" y="168" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="728" y="176" width="44" height="12" rx="2"/><text class="tagtext" x="750" y="185" text-anchor="middle">STEP 5</text></g><text class="name" x="728" y="210">Draft</text><text class="sub" x="728" y="226">Ternary-Bonsai-2-27B</text></g>
  <g class="node"><rect class="node-accent" x="488" y="168" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="496" y="176" width="76" height="12" rx="2"/><text class="tagtext" x="534" y="185" text-anchor="middle">STEP 6 · YOU</text></g><text class="name" x="496" y="210">Edit and export</text><text class="sub" x="496" y="226">PDF · DOCX · never sent</text></g>
  <g class="node"><rect class="node" x="256" y="168" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="264" y="176" width="76" height="12" rx="2"/><text class="tagtext" x="302" y="185" text-anchor="middle">STEP 7 · YOU</text></g><text class="name" x="264" y="210">Record the outcome</text><text class="sub" x="264" y="226">closes the case</text></g>
  <g class="node"><rect class="node-optional" x="24" y="168" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="32" y="176" width="112" height="12" rx="2"/><text class="tagtext" x="88" y="185" text-anchor="middle">V1.1 · AFTER HOURS</text></g><text class="name" x="32" y="210">Payer call</text><text class="sub" x="32" y="226">Voxtral-Small-24B</text></g>
  <g class="node"><rect class="node" x="256" y="312" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="264" y="320" width="48" height="12" rx="2"/><text class="tagtext" x="288" y="329" text-anchor="middle">MANAGER</text></g><text class="name" x="264" y="354">Manager dashboard</text><text class="sub" x="264" y="370">opted-in profiles only</text></g>
  <g class="chip"><rect class="chip" x="364" y="268" width="92" height="16" rx="2"/><text class="label" x="410" y="279" text-anchor="middle">DE-IDENTIFIED</text></g>
  <g class="chip"><rect class="chip" x="132" y="124" width="76" height="16" rx="2"/><text class="label" x="170" y="135" text-anchor="middle">TRANSCRIPT</text></g>
  <text class="callout" x="488" y="340">Ask the Hermes agent: it answers from the</text>
  <text class="callout" x="488" y="362">global corpus and never sees a document.</text>
  <text class="eyebrow" x="24" y="432">LEGEND</text>
  <rect class="tag sample" x="104" y="420" width="32" height="16" rx="2"/>
  <text class="legend" x="144" y="432">STEP n · YOU: your step</text>
  <rect class="node-accent sample" x="344" y="420" width="32" height="16" rx="4"/>
  <text class="legend" x="384" y="432">you review it before it leaves</text>
  <path class="arrow nophi sample" d="M632 428H664" marker-end="url(#flow-user-head)"/>
  <text class="legend" x="672" y="432">no case content</text>
</svg>
