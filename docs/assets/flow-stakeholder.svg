<svg xmlns="http://www.w3.org/2000/svg" class="dark" viewBox="0 0 968 600" width="968" height="600" role="img" aria-labelledby="flow-stakeholder-title flow-stakeholder-desc">
  <title id="flow-stakeholder-title">ClaimCoach: what stays on the Mac</title>
  <desc id="flow-stakeholder-desc">Case documents go from the ClaimCoach pane through plugin_api.py to the worker, the local models, and the encrypted user corpus, all on the Mac; the Hermes chat agent, which may run on a cloud model, gets only case IDs, codes, payer names, and redacted summaries from the agent tools; model weights come in only after the user confirms a download.</desc>
  <style>
    :root{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}
    .dark{--background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--card-foreground:oklch(0.985 0 0);--primary:oklch(0.922 0 0);--secondary:oklch(0.269 0 0);--secondary-foreground:oklch(0.985 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);--border:oklch(1 0 0 / 10%);--ring:oklch(0.556 0 0);--chart-2:oklch(0.556 0 0);}
    @media (prefers-color-scheme: light){:root.dark{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}}
    text{font-family:Geist,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;stroke:none}
    rect.node{fill:var(--card);stroke:var(--border);stroke-width:1}
    rect.node-accent{fill:var(--card);stroke:var(--primary);stroke-width:1.2}
    rect.node-optional{fill:var(--card);stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    rect.tag{fill:none;stroke:var(--ring);stroke-width:0.8}
    rect.chip{fill:var(--secondary);stroke:var(--border);stroke-width:0.8}
    rect.frame{fill:var(--muted);fill-opacity:0.35;stroke:var(--chart-2);stroke-width:1}
    rect.tab{fill:var(--secondary);stroke:var(--chart-2);stroke-width:1}
    path.rule{fill:none;stroke:var(--border);stroke-width:0.8}
    path.life{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:3 3}
    path.arrow{fill:none;stroke:var(--muted-foreground);stroke-width:1}
    path.nophi{stroke-dasharray:5 4}
    path.return{stroke-dasharray:5 4}
    path.arrow-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    polygon.head{fill:var(--muted-foreground)}
    polygon.head-accent{fill:var(--primary)}
    polyline.head-open{fill:none;stroke:var(--muted-foreground);stroke-width:1.2}
    .name{fill:var(--card-foreground);font-size:14px;font-weight:600}
    .sub{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
    .tagtext{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:500;letter-spacing:0.08em}
    .label{fill:var(--secondary-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:0.06em}
    .eyebrow{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;letter-spacing:0.14em}
    .msg{fill:var(--foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .guard{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .callout{fill:var(--muted-foreground);font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}
    .legend{fill:var(--muted-foreground);font-size:12px}
  </style>
  <defs><marker id="flow-stakeholder-head" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker><marker id="flow-stakeholder-head-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="flow-stakeholder-head-open" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polyline class="head-open" points="0 0, 8 3, 0 6"/></marker></defs>
  <rect class="zone-accent" x="24" y="24" width="920" height="344" rx="8"/>
  <rect class="zone" x="24" y="400" width="920" height="112" rx="4"/>
  <path class="arrow" d="M248 100H272" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow" d="M472 100H496" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow" d="M696 100H720" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow" d="M148 136V248" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow nophi" d="M544 136V168A8 8 0 0 1 536 176H380A8 8 0 0 0 372 184V248" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow" d="M596 136V248" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow nophi" d="M648 136V192A8 8 0 0 0 656 200H812A8 8 0 0 1 820 208V248" marker-end="url(#flow-stakeholder-head)"/>
  <path class="arrow-accent nophi" d="M820 320V424" marker-end="url(#flow-stakeholder-head-accent)"/>
  <path class="rule" d="M24 544H944"/>
  <text class="eyebrow" x="40" y="44">THIS MAC · CASE CONTENT STAYS HERE</text>
  <text class="eyebrow" x="40" y="420">OUTSIDE THE MAC</text>
  <g class="node"><rect class="node" x="48" y="64" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="56" y="72" width="20" height="12" rx="2"/><text class="tagtext" x="66" y="81" text-anchor="middle">UI</text></g><text class="name" x="56" y="106">ClaimCoach pane</text><text class="sub" x="56" y="122">Hermes Desktop</text></g>
  <g class="node"><rect class="node" x="272" y="64" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="280" y="72" width="48" height="12" rx="2"/><text class="tagtext" x="304" y="81" text-anchor="middle">GATEWAY</text></g><text class="name" x="280" y="106">plugin_api.py</text><text class="sub" x="280" y="122">/api/plugins/claimcoach</text></g>
  <g class="node"><rect class="node" x="496" y="64" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="504" y="72" width="44" height="12" rx="2"/><text class="tagtext" x="526" y="81" text-anchor="middle">WORKER</text></g><text class="name" x="504" y="106">Worker</text><text class="sub" x="504" y="122">127.0.0.1:18200</text></g>
  <g class="node"><rect class="node" x="720" y="64" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="728" y="72" width="28" height="12" rx="2"/><text class="tagtext" x="742" y="81" text-anchor="middle">MLX</text></g><text class="name" x="728" y="106">Local models</text><text class="sub" x="728" y="122">7 roles · loopback</text></g>
  <g class="node"><rect class="node" x="48" y="248" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="56" y="256" width="32" height="12" rx="2"/><text class="tagtext" x="72" y="265" text-anchor="middle">FILE</text></g><text class="name" x="56" y="290">PDF or DOCX</text><text class="sub" x="56" y="306">draft for human review</text></g>
  <g class="node"><rect class="node" x="272" y="248" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="280" y="256" width="44" height="12" rx="2"/><text class="tagtext" x="302" y="265" text-anchor="middle">SQLITE</text></g><text class="name" x="280" y="290">Global corpus</text><text class="sub" x="280" y="306">rules · codes · templates</text></g>
  <g class="node"><rect class="node" x="496" y="248" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="504" y="256" width="44" height="12" rx="2"/><text class="tagtext" x="526" y="265" text-anchor="middle">SQLITE</text></g><text class="name" x="504" y="290">User corpus</text><text class="sub" x="504" y="306">AES-256 · Keychain key</text></g>
  <g class="node"><rect class="node" x="720" y="248" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="728" y="256" width="44" height="12" rx="2"/><text class="tagtext" x="750" y="265" text-anchor="middle">HERMES</text></g><text class="name" x="728" y="290">Agent tools</text><text class="sub" x="728" y="306">redact every result</text></g>
  <g class="node"><rect class="node-optional" x="720" y="424" width="200" height="72" rx="6"/><g class="tag"><rect class="tag" x="728" y="432" width="76" height="12" rx="2"/><text class="tagtext" x="766" y="441" text-anchor="middle">MAY BE CLOUD</text></g><text class="name" x="728" y="466">Hermes chat agent</text><text class="sub" x="728" y="482">IDs · codes · payer names</text></g>
  <g class="chip"><rect class="chip" x="156" y="184" width="80" height="16" rx="2"/><text class="label" x="196" y="195" text-anchor="middle">YOU FILE IT</text></g>
  <g class="chip"><rect class="chip" x="380" y="208" width="88" height="16" rx="2"/><text class="label" x="424" y="219" text-anchor="middle">BY EXACT KEY</text></g>
  <g class="chip"><rect class="chip" x="536" y="208" width="52" height="16" rx="2"/><text class="label" x="562" y="219" text-anchor="middle">SEALED</text></g>
  <g class="chip"><rect class="chip" x="700" y="176" width="64" height="16" rx="2"/><text class="label" x="732" y="187" text-anchor="middle">REDACTED</text></g>
  <g class="chip"><rect class="chip" x="828" y="376" width="92" height="16" rx="2"/><text class="label" x="874" y="387" text-anchor="middle">REDACTED ONLY</text></g>
  <text class="callout" x="48" y="452">Model weights arrive only after you confirm a download.</text>
  <text class="callout" x="48" y="480">Nothing is sent to a payer: you file the export yourself.</text>
  <text class="eyebrow" x="24" y="568">LEGEND</text>
  <path class="arrow sample" d="M104 564H136" marker-end="url(#flow-stakeholder-head)"/>
  <text class="legend" x="144" y="568">case content (PHI)</text>
  <path class="arrow nophi sample" d="M308 564H340" marker-end="url(#flow-stakeholder-head)"/>
  <text class="legend" x="348" y="568">no case content</text>
  <path class="arrow-accent nophi sample" d="M488 564H520" marker-end="url(#flow-stakeholder-head-accent)"/>
  <text class="legend" x="528" y="568">leaves the Mac, redacted</text>
</svg>
