<svg xmlns="http://www.w3.org/2000/svg" class="dark" viewBox="0 0 960 736" width="960" height="736" role="img" aria-labelledby="flow-request-title flow-request-desc">
  <title id="flow-request-title">A ClaimCoach request, from the pane to a model and back</title>
  <desc id="flow-request-desc">The pane posts /cases/{case_id}/process; plugin_api.py forwards /cases/{case_id}/extract to the worker with the per-launch bearer token and relays JobStarted; the worker starts the extraction model on first use under the memory guard, calls it, and stores the result sealed; until the job ends the gateway long-polls /jobs/{job_id}/events and publishes plugin.claimcoach.case.progress; then the pane reads the case through the gateway.</desc>
  <style>
    :root{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}
    .dark{--background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--card-foreground:oklch(0.985 0 0);--primary:oklch(0.922 0 0);--secondary:oklch(0.269 0 0);--secondary-foreground:oklch(0.985 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);--border:oklch(1 0 0 / 10%);--ring:oklch(0.556 0 0);--chart-2:oklch(0.556 0 0);}
    @media (prefers-color-scheme: light){:root.dark{--background:oklch(1 0 0);--foreground:oklch(0.145 0 0);--card:oklch(1 0 0);--card-foreground:oklch(0.145 0 0);--primary:oklch(0.205 0 0);--secondary:oklch(0.97 0 0);--secondary-foreground:oklch(0.205 0 0);--muted:oklch(0.97 0 0);--muted-foreground:oklch(0.556 0 0);--border:oklch(0.922 0 0);--ring:oklch(0.708 0 0);--chart-2:oklch(0.556 0 0);}}
    text{font-family:Geist,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;stroke:none}
    rect.node{fill:var(--card);stroke:var(--border);stroke-width:1}
    rect.node-accent{fill:var(--card);stroke:var(--primary);stroke-width:1.2}
    rect.node-optional{fill:var(--card);stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:4 3}
    rect.zone-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    rect.tag{fill:none;stroke:var(--ring);stroke-width:0.8}
    rect.chip{fill:var(--secondary);stroke:var(--border);stroke-width:0.8}
    rect.frame{fill:var(--muted);fill-opacity:0.35;stroke:var(--chart-2);stroke-width:1}
    rect.tab{fill:var(--secondary);stroke:var(--chart-2);stroke-width:1}
    path.rule{fill:none;stroke:var(--border);stroke-width:0.8}
    path.life{fill:none;stroke:var(--chart-2);stroke-width:1;stroke-dasharray:3 3}
    path.arrow{fill:none;stroke:var(--muted-foreground);stroke-width:1}
    path.nophi{stroke-dasharray:5 4}
    path.return{stroke-dasharray:5 4}
    path.arrow-accent{fill:none;stroke:var(--primary);stroke-width:1.2}
    polygon.head{fill:var(--muted-foreground)}
    polygon.head-accent{fill:var(--primary)}
    polyline.head-open{fill:none;stroke:var(--muted-foreground);stroke-width:1.2}
    .name{fill:var(--card-foreground);font-size:14px;font-weight:600}
    .sub{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
    .tagtext{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:8px;font-weight:500;letter-spacing:0.08em}
    .label{fill:var(--secondary-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;letter-spacing:0.06em}
    .eyebrow{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px;font-weight:500;letter-spacing:0.14em}
    .msg{fill:var(--foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .guard{fill:var(--muted-foreground);font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:9px}
    .callout{fill:var(--muted-foreground);font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-size:14px}
    .legend{fill:var(--muted-foreground);font-size:12px}
  </style>
  <defs><marker id="flow-request-head" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker><marker id="flow-request-head-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="flow-request-head-open" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polyline class="head-open" points="0 0, 8 3, 0 6"/></marker></defs>
  <path class="life" d="M96 80V640"/>
  <path class="life" d="M288 80V640"/>
  <path class="life" d="M480 80V640"/>
  <path class="life" d="M672 80V640"/>
  <path class="life" d="M864 80V640"/>
  <rect class="frame" x="84" y="384" width="408" height="144" rx="4"/>
  <path class="arrow" d="M96 112H288" marker-end="url(#flow-request-head)"/>
  <path class="arrow" d="M288 144H480" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M480 200H288" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M288 232H96" marker-end="url(#flow-request-head)"/>
  <path class="arrow" d="M480 272H672" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M672 328H480" marker-end="url(#flow-request-head)"/>
  <path class="arrow-accent" d="M480 360H864" marker-end="url(#flow-request-head-accent)"/>
  <path class="arrow" d="M288 448H480" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M480 480H288" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M288 512H96" marker-end="url(#flow-request-head-open)"/>
  <path class="arrow" d="M96 576H288" marker-end="url(#flow-request-head)"/>
  <path class="arrow return" d="M288 624H96" marker-end="url(#flow-request-head)"/>
  <path class="rule" d="M24 656H936"/>
  <g class="node"><rect class="node" x="16" y="24" width="160" height="56" rx="6"/><text class="name" x="96" y="48" text-anchor="middle">Pane</text><text class="sub" x="96" y="66" text-anchor="middle">plugin.js · ctx.rest</text></g>
  <g class="node"><rect class="node" x="208" y="24" width="160" height="56" rx="6"/><text class="name" x="288" y="48" text-anchor="middle">plugin_api.py</text><text class="sub" x="288" y="66" text-anchor="middle">Hermes gateway</text></g>
  <g class="node"><rect class="node" x="400" y="24" width="160" height="56" rx="6"/><text class="name" x="480" y="48" text-anchor="middle">Worker</text><text class="sub" x="480" y="66" text-anchor="middle">127.0.0.1:18200</text></g>
  <g class="node"><rect class="node" x="592" y="24" width="160" height="56" rx="6"/><text class="name" x="672" y="48" text-anchor="middle">Model server</text><text class="sub" x="672" y="66" text-anchor="middle">extraction · :18201</text></g>
  <g class="node"><rect class="node" x="784" y="24" width="160" height="56" rx="6"/><text class="name" x="864" y="48" text-anchor="middle">User corpus</text><text class="sub" x="864" y="66" text-anchor="middle">sealed values</text></g>
  <g class="tag"><rect class="tab" x="84" y="384" width="40" height="16" rx="2"/><text class="label" x="104" y="396" text-anchor="middle">LOOP</text></g>
  <text class="guard" x="108" y="420">[until the job ends]</text>
  <text class="msg" x="192" y="104" text-anchor="middle">POST /cases/{case_id}/process</text>
  <text class="msg" x="384" y="136" text-anchor="middle">POST /cases/{case_id}/extract</text>
  <text class="guard" x="384" y="164" text-anchor="middle">per-launch bearer token</text>
  <text class="msg" x="384" y="192" text-anchor="middle">JobStarted {job_id, kind}</text>
  <text class="msg" x="192" y="224" text-anchor="middle">JobStarted</text>
  <text class="msg" x="576" y="264" text-anchor="middle">POST /v1/chat/completions</text>
  <text class="guard" x="576" y="292" text-anchor="middle">first use · memory guard</text>
  <text class="msg" x="576" y="320" text-anchor="middle">JSON fields, read as data</text>
  <text class="msg" x="768" y="352" text-anchor="middle">put_case_item + audit_log</text>
  <text class="msg" x="384" y="440" text-anchor="middle">GET /jobs/{job_id}/events</text>
  <text class="msg" x="384" y="472" text-anchor="middle">events after n</text>
  <text class="msg" x="192" y="504" text-anchor="middle">plugin.claimcoach.case.progress</text>
  <text class="msg" x="192" y="568" text-anchor="middle">GET /cases/{case_id}</text>
  <text class="guard" x="192" y="596" text-anchor="middle">proxied to the worker</text>
  <text class="msg" x="192" y="616" text-anchor="middle">Case</text>
  <text class="eyebrow" x="24" y="680">LEGEND</text>
  <path class="arrow sample" d="M104 676H136" marker-end="url(#flow-request-head)"/>
  <text class="legend" x="144" y="680">call</text>
  <path class="arrow return sample" d="M208 676H240" marker-end="url(#flow-request-head)"/>
  <text class="legend" x="248" y="680">return</text>
  <path class="arrow return sample" d="M324 676H356" marker-end="url(#flow-request-head-open)"/>
  <text class="legend" x="364" y="680">event</text>
  <path class="arrow-accent sample" d="M432 676H464" marker-end="url(#flow-request-head-accent)"/>
  <text class="legend" x="472" y="680">the sealed write</text>
  <text class="callout" x="96" y="720">Diagnose, draft, and correct follow the same steps.</text>
</svg>
