# ClaimCoach Hermes plugin manifest (v2). US-1.1, US-3.2; PRD §7.9 PC-1, PC-2, PC-5, PC-7.
# config_schema is rendered from claimcoach.settings.ClaimCoachSettings; a test fails on drift.
name: claimcoach
version: 0.1.0
label: ClaimCoach
description: Local-only denial-management coach for medical billers. PHI never leaves the Mac.
author: ClaimCoach
license: Proprietary
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.5"
python_runtime: external
tags:
  - medical-billing
  - local-only
provides_tools:
  - claimcoach_explain_code
  - claimcoach_payer_rules
  - claimcoach_case_summary
# US-3.2: second PHI guard over claimcoach_* tool results (fail-open, so defense in depth only).
provides_hooks:
  - transform_tool_result
config_schema:
  models_home:
    type: str
    default: ~/Models
    description: Directory that holds local model weights (MODELS_HOME). Weights are never copied.
  retention_days:
    type: int
    default: 90
    description: Days after a case closes before its source documents are purged.
  richer_agent_access:
    type: bool
    default: false
    description: 'Richer agent access when your Hermes model is local. Off by default and shown in
      the statusbar. Reserved: until its scope is decided, agent tool results stay redacted.'
  share_outcome_stats:
    type: bool
    default: false
    description: Share this profile's de-identified case outcomes (no documents, names, or IDs) with
      the manager's weekly summary and the manager-approved fine-tune export. Off by default; turn
      it off to stop sharing.
